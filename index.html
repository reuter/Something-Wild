<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2c5f9e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Something Wild Solo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --navy: #2c5f9e;
  --navy-d: #1d4274;
  --ink: #1b2233;
  --paper: #eef2f7;
  --paper-2: #dde5ef;
  --logo-red: #e2323f;
  --gold: #f6c22d;
  --radius: 14px;
  --c-red: #e8404e; --d-red: #a8212c; --l-red: #ff9aa0;
  --c-blue: #1f7fd1; --d-blue: #14518a; --l-blue: #8cc4f2;
  --c-green: #16a58a; --d-green: #0c6b59; --l-green: #7fdcc8;
  --c-yellow: #f5b01c; --d-yellow: #8a5c00; --l-yellow: #ffe08a;
  --c-purple: #7b4cc0; --d-purple: #4d2a85; --l-purple: #c4a6ee;
  --cw: 84px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Trebuchet MS", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- header ---------- */
.topbar {
  display: flex; align-items: center; gap: 8px;
  background: var(--navy); color: #fff;
  padding: max(8px, env(safe-area-inset-top)) 12px 8px;
  position: sticky; top: 0; z-index: 20;
}
.logo { font-weight: 900; font-size: 20px; letter-spacing: .5px; line-height: 1; flex: 1; text-transform: uppercase; }
.logo b { color: #fff; background: var(--logo-red); padding: 2px 8px 3px; border-radius: 6px; margin-left: 4px; font-style: italic; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.iconbtn {
  background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 10px;
  min-width: 40px; height: 36px; padding: 0 12px; font-weight: 800; font-size: 14px;
}
.iconbtn:active { background: rgba(255,255,255,.3); }

/* ---------- setup screen ---------- */
.setup { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
.hero {
  background: var(--navy); color: #fff; border-radius: 22px; padding: 22px 18px 20px; text-align: center;
  box-shadow: 0 6px 0 var(--navy-d);
}
.hero h1 { margin: 0; font-size: clamp(34px, 11vw, 52px); line-height: .95; text-transform: uppercase; letter-spacing: 1px; }
.hero h1 span { display: block; color: #fff; }
.hero h1 em { display: inline-block; background: var(--logo-red); font-style: italic; padding: 2px 14px 6px; border-radius: 10px; margin-top: 4px; box-shadow: 0 3px 0 rgba(0,0,0,.25); transform: rotate(-2deg); }
.hero p { margin: 14px 0 0; opacity: .9; font-weight: 600; }
.hero .fan { display: flex; justify-content: center; margin-top: 16px; --cw: 62px; }
.hero .fan .card { margin: 0 -8px; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
.hero .fan .card:nth-child(1) { transform: rotate(-12deg) translateY(6px); }
.hero .fan .card:nth-child(2) { transform: rotate(-6deg) translateY(1px); }
.hero .fan .card:nth-child(3) { transform: rotate(0); z-index: 2; }
.hero .fan .card:nth-child(4) { transform: rotate(6deg) translateY(1px); }
.hero .fan .card:nth-child(5) { transform: rotate(12deg) translateY(6px); }
.panel { background: #fff; border-radius: 18px; padding: 14px; margin-top: 14px; box-shadow: 0 2px 0 var(--paper-2), 0 6px 18px rgba(30,50,90,.08); }
.panel h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #5a6a85; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  flex: 1 1 0; min-width: 64px; padding: 11px 8px; border-radius: 12px; border: 2px solid var(--paper-2);
  background: #fff; font-weight: 800; color: var(--ink);
}
.seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: 0 3px 0 var(--navy-d); }
.opp-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.opp-row .av { width: 40px; height: 40px; flex: none; }
.opp-row .nm { font-weight: 800; width: 66px; flex: none; }
.opp-row .seg { flex: 1; }
.opp-row .seg button { padding: 8px 2px; min-width: 0; font-size: 12px; }
.bigbtn {
  display: block; width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 16px;
  background: var(--logo-red); color: #fff; font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
  box-shadow: 0 5px 0 #a8212c;
}
.bigbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a8212c; }
.fine { text-align: center; font-size: 12px; color: #6b7b95; margin-top: 14px; }
.linkbtn { background: none; border: 0; color: var(--navy); font-weight: 800; text-decoration: underline; padding: 6px; }

/* ---------- cards ---------- */
.card {
  position: relative; width: var(--cw); aspect-ratio: 5 / 7; flex: none;
  border-radius: calc(var(--cw) * .1); background: var(--c);
  border: calc(var(--cw) * .04) solid #fff; box-shadow: 0 2px 6px rgba(20,30,60,.3);
  overflow: hidden; color: #fff;
  transition: transform .15s ease, box-shadow .15s ease;
}
.card .art { position: absolute; left: 0; right: 0; top: 8%; bottom: 15%; background: radial-gradient(circle at 50% 48%, rgba(255,255,255,.6), rgba(255,255,255,0) 66%); }
.card .art svg { width: 100%; height: 100%; display: block; }
.card .num {
  position: absolute; left: 5%; top: 4%; width: 27%; aspect-ratio: 1; border-radius: 50%;
  background: #fff; color: var(--c); display: grid; place-items: center; z-index: 2;
  font-weight: 900; font-size: calc(var(--cw) * .22); line-height: 1; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.card .nm {
  position: absolute; left: 0; right: 0; bottom: 0; height: 15%; background: #fff; color: var(--d);
  display: grid; place-items: center; font-weight: 900; text-transform: uppercase;
  font-size: calc(var(--cw) * .095); letter-spacing: .3px; white-space: nowrap;
}
.card .msym { position: absolute; right: 5%; top: 5%; width: 19%; z-index: 2; background: rgba(255,255,255,.92); border-radius: 6px; padding: 2px; }
.card .msym svg { width: 100%; display: block; }
.card.back {
  background: linear-gradient(135deg, #fff 0 6%, var(--navy) 6% 100%);
  display: grid; place-items: center;
}
.card.back::after {
  content: "WILD!"; color: #fff; font-weight: 900; font-style: italic; transform: rotate(-12deg);
  font-size: calc(var(--cw) * .2); background: var(--logo-red); padding: 2px 6px; border-radius: 5px; box-shadow: 0 2px 0 rgba(0,0,0,.3);
}
.card.empty { background: transparent; border: 2px dashed #a9b6cb; box-shadow: none; }
.c-red { --c: var(--c-red); --d: var(--d-red); --l: var(--l-red); }
.c-blue { --c: var(--c-blue); --d: var(--d-blue); --l: var(--l-blue); }
.c-green { --c: var(--c-green); --d: var(--d-green); --l: var(--l-green); }
.c-yellow { --c: var(--c-yellow); --d: var(--d-yellow); --l: var(--l-yellow); }
.c-purple { --c: var(--c-purple); --d: var(--d-purple); --l: var(--l-purple); }
.card.sm { --cw: 46px; }
.card.sm .nm, .card.sm .msym { display: none; }
.card.sm .art { bottom: 0; }
.card.md { --cw: 62px; }
.card.md .nm { font-size: 7px; }
.card.lg { --cw: 110px; }

.selectable { cursor: pointer; outline: 3px solid var(--gold); outline-offset: 1px; animation: glow 1.1s ease-in-out infinite; }
@keyframes glow { 0%, 100% { outline-color: var(--gold); } 50% { outline-color: #fff; } }
.picked { outline: 4px solid #fff; box-shadow: 0 0 0 3px var(--logo-red), 0 8px 18px rgba(0,0,0,.35); transform: translateY(-14px) scale(1.04) !important; animation: none; z-index: 5; }
.hinted::before { content: "\2605"; position: absolute; z-index: 6; right: 3px; bottom: 18%; color: #fff; background: var(--logo-red); border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.fresh { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.4) translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* ---------- power cards ---------- */
.pcard {
  width: var(--pw, 180px); background: #fff; border-radius: 12px; overflow: hidden; border: 3px solid var(--c);
  box-shadow: 0 2px 8px rgba(20,30,60,.25); text-align: center; flex: none; position: relative;
}
.pcard .ptop { background: var(--c); color: #fff; font-weight: 900; font-size: 12px; text-transform: uppercase; padding: 3px 6px; letter-spacing: .4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.pcard .pico { background: linear-gradient(#f7f9fc, #e8edf5); padding: 6px 8px; }
.pcard .pico svg { width: 100%; height: 46px; display: block; }
.pcard .ptxt { font-size: 11px; line-height: 1.25; padding: 5px 7px 7px; font-weight: 600; color: #3b475e; }
.pcard.mini { --pw: 64px; border-width: 2px; border-radius: 9px; }
.pcard.mini .ptop { font-size: 8px; padding: 2px 2px; }
.pcard.mini .pico { padding: 3px 3px; }
.pcard.mini .pico svg { height: 24px; }
.pcard.mini .ptxt { display: none; }
.pcard.big { --pw: 150px; }
.pcard.disabled { filter: grayscale(.85); opacity: .65; }
.pcard .stripe { position: absolute; right: 0; top: 0; background: var(--gold); color: #3b2c00; font-size: 10px; font-weight: 900; padding: 2px 6px; border-bottom-left-radius: 8px; }

/* ---------- game screen ---------- */
.game { display: flex; flex-direction: column; min-height: calc(100dvh - 52px); max-width: 980px; margin: 0 auto; padding: 8px 8px 0; gap: 8px; }
.opps { display: flex; flex-direction: column; gap: 6px; }
@media (min-width: 760px) { .opps { flex-direction: row; } .opps .opp { flex: 1; } }
.opp { background: #fff; border-radius: 14px; padding: 7px 9px 8px; box-shadow: 0 2px 0 var(--paper-2); position: relative; border: 3px solid transparent; transition: border-color .2s, box-shadow .2s; min-width: 0; }
.opp.active, .me.active { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(246,194,45,.35); }
.head { display: flex; align-items: center; gap: 7px; min-height: 30px; }
.head .av { width: 28px; height: 28px; flex: none; }
.head .who { font-weight: 900; font-size: 14px; }
.lvl { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .6px; padding: 2px 6px; border-radius: 99px; background: var(--paper-2); color: #4a5a76; }
.lvl.hard { background: #ffd9dc; color: #8a1d27; }
.lvl.unpredictable { background: #e6d9ff; color: #4d2a85; }
.lvl.easy { background: #d5f4e8; color: #0c6b59; }
.lvl.medium { background: #fff0c4; color: #7a5600; }
.pips { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.pip { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #b7c2d6; background: #fff; }
.pip.on { background: var(--gold); border-color: #c99a00; box-shadow: 0 0 0 2px rgba(246,194,45,.35); }
.handcount { display: flex; align-items: center; gap: 3px; font-weight: 900; font-size: 12px; color: #4a5a76; }
.handcount .mb { width: 11px; height: 15px; border-radius: 2px; background: var(--navy); border: 1px solid #fff; box-shadow: 0 0 0 1px #9fb0cc; }
.moverchip { width: 26px; height: 32px; flex: none; }
.moverchip svg { width: 100%; height: 100%; }
.tabrow { display: flex; align-items: flex-end; min-height: 56px; margin-top: 4px; padding-left: 2px; }
.tabrow .card { margin-right: -8px; }
.tabrow .card:last-child { margin-right: 0; }
.tabrow.empty::before { content: "nothing in play yet"; color: #9aa8bf; font-size: 11px; font-weight: 700; align-self: center; }
.pwrow { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }

.center { display: flex; align-items: flex-start; justify-content: center; gap: 10px; padding: 8px; background: linear-gradient(#e3eaf4, #d6e0ee); border-radius: 16px; }
.pile { text-align: center; font-size: 11px; font-weight: 800; color: #4a5a76; --cw: 58px; }
.pile .card { margin: 0 auto 3px; }
.pile .count { display: block; }
.centerpower { text-align: center; }
.centerpower .hint { display: block; font-size: 10.5px; font-weight: 800; color: #4a5a76; margin-top: 4px; max-width: 150px; }
.hint .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); vertical-align: -1px; margin-right: 2px; }
.moverbox { text-align: center; font-size: 10.5px; font-weight: 800; color: #4a5a76; width: 62px; }
.moverbox .tok { width: 46px; height: 56px; margin: 0 auto 2px; }
.moverbox .tok svg { width: 100%; height: 100%; }
.moverbox.held .tok { opacity: .35; filter: grayscale(.6); }
.ticker { text-align: center; min-height: 36px; font-weight: 700; font-size: 13px; color: #33415c; padding: 0 6px; display: flex; flex-direction: column; justify-content: center; }
.ticker div:last-child { font-weight: 900; color: var(--ink); }
.ticker div:not(:last-child) { opacity: .55; font-size: 12px; }

.me { background: #fff; border-radius: 14px; padding: 7px 9px 9px; box-shadow: 0 2px 0 var(--paper-2); border: 3px solid transparent; }
.me .tabrow { min-height: 92px; }
.me .tabrow .card { --cw: 62px; margin-right: -4px; }
.hand { display: flex; justify-content: center; gap: 6px; padding: 10px 4px 10px; }
.hand .card { --cw: min(23vw, 92px); }
@media (min-width: 760px) { .hand .card { --cw: 100px; } .me .tabrow .card { --cw: 78px; } .card.sm { --cw: 54px; } .card.md { --cw: 70px; } }
.hand .card:active { transform: translateY(-4px); }

/* ---------- prompt bar ---------- */
.promptbar {
  position: sticky; bottom: 0; z-index: 15; margin: 0 -8px; padding: 10px 12px max(10px, env(safe-area-inset-bottom));
  background: var(--navy); color: #fff; display: flex; align-items: center; gap: 10px; min-height: 62px;
  box-shadow: 0 -4px 14px rgba(20,40,80,.25);
}
.promptbar .msg { flex: 1; font-weight: 800; font-size: 15px; line-height: 1.2; }
.promptbar .msg small { display: block; font-weight: 600; opacity: .85; font-size: 12px; margin-top: 2px; }
.pbtn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 900; font-size: 15px; background: #fff; color: var(--navy-d); box-shadow: 0 3px 0 rgba(0,0,0,.25); white-space: nowrap; }
.pbtn.primary { background: var(--logo-red); color: #fff; }
.pbtn[disabled] { opacity: .45; box-shadow: none; }
.pbtn:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.dots::after { content: ""; display: inline-block; width: 1.4em; text-align: left; animation: dots 1.2s steps(4, end) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

/* ---------- sheets / overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15,25,50,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.scrim.center-modal { align-items: center; padding: 16px; }
.sheet { background: #fff; width: 100%; max-width: 620px; border-radius: 22px 22px 0 0; padding: 16px 14px max(16px, env(safe-area-inset-bottom)); max-height: 82dvh; overflow: auto; animation: rise .22s ease-out; }
.center-modal .sheet { border-radius: 22px; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 0 0 4px; font-size: 20px; }
.sheet .sub { margin: 0 0 12px; color: #5a6a85; font-weight: 600; font-size: 14px; }
.sheet h4 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #5a6a85; }
.plist { display: flex; flex-direction: column; gap: 10px; }
.popt { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; border: 2px solid var(--paper-2); background: #fff; text-align: left; width: 100%; }
.popt:not([disabled]):active { background: #f3f6fb; }
.popt .pcard { --pw: 118px; }
.popt .ptxt { display: none; }
.popt .info { flex: 1; font-size: 13px; font-weight: 700; color: #3b475e; line-height: 1.3; }
.popt .info b { display: block; font-size: 15px; color: var(--ink); }
.popt .info .why { color: #b33; font-size: 12px; }
.popt .star { color: #0c6b59; font-weight: 900; }
.popt[disabled] { opacity: .55; }
.colorgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 8px 0; }
.colorgrid button { aspect-ratio: 1; border: 3px solid #fff; border-radius: 16px; font-weight: 900; color: #fff; font-size: 11px; text-transform: uppercase; box-shadow: 0 3px 0 rgba(0,0,0,.25); background: var(--c); }
.numgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 8px 0; }
.numgrid button { padding: 14px 0; border-radius: 14px; border: 2px solid var(--paper-2); background: #fff; font-size: 22px; font-weight: 900; box-shadow: 0 3px 0 var(--paper-2); }
.numgrid button:active { background: var(--navy); color: #fff; }
.cardrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0; }
.cardrow .card { --cw: 62px; }
.tripleopt { display: flex; gap: 4px; padding: 8px; border-radius: 14px; border: 2px solid var(--paper-2); background: #fff; margin-bottom: 8px; width: 100%; align-items: center; justify-content: center; }
.tripleopt .card { --cw: 58px; }
.tripleopt .lbl { margin-left: 10px; font-weight: 800; font-size: 13px; text-align: left; flex: 1; }
.skipbtn { width: 100%; margin-top: 10px; padding: 13px; border-radius: 14px; border: 2px solid var(--paper-2); background: #fff; font-weight: 900; font-size: 15px; color: #4a5a76; }
.rules p, .rules li { font-size: 14px; line-height: 1.45; color: #2e3a52; }
.rules ol { padding-left: 20px; margin: 6px 0; }
.rules .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 440px) { .rules .pgrid { grid-template-columns: 1fr; } }
.rules .pcard { --pw: 100%; }
.rules .pcard .pico svg { height: 40px; }

/* ---------- banners ---------- */
.banner { position: fixed; left: 50%; top: 28%; transform: translateX(-50%); z-index: 60; pointer-events: none; text-align: center; animation: bannerIn 2s ease both; width: min(92vw, 520px); }
.banner .b { display: inline-block; background: var(--logo-red); color: #fff; font-weight: 900; font-size: clamp(22px, 7vw, 38px); text-transform: uppercase; font-style: italic; padding: 8px 22px 12px; border-radius: 16px; box-shadow: 0 6px 0 #a8212c, 0 10px 30px rgba(0,0,0,.3); transform: rotate(-2deg); }
.banner .s { margin-top: 10px; background: #fff; border-radius: 12px; display: inline-block; padding: 7px 14px; font-weight: 800; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
@keyframes bannerIn { 0% { opacity: 0; transform: translateX(-50%) scale(.5) rotate(-6deg); } 12% { opacity: 1; transform: translateX(-50%) scale(1.05); } 20% { transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
.win { text-align: center; }
.win .trophy { font-size: 56px; }
.win h2 { font-size: 30px; text-transform: uppercase; font-style: italic; margin: 6px 0; color: var(--logo-red); }
.win .row { display: flex; gap: 10px; margin-top: 14px; }
.win .row button { flex: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- layout v2: compact table (overrides earlier rules) ---------- */
.opps { display: grid !important; grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr)); gap: 6px; }
.opp {
  --pw: calc((min(100vw, 980px) - 16px - (var(--n, 1) - 1) * 6px) / var(--n, 1));
  --ocw: clamp(26px, calc((var(--pw) - 26px) / 3.3), 56px);
  padding: 6px 7px 7px;
}
.opp .h1 { display: flex; align-items: center; gap: 5px; min-height: 26px; }
.opp .h1 .av { width: 24px; height: 24px; flex: none; }
.opp .h1 .who { font-weight: 900; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opp .h1 .moverchip { width: 18px; height: 24px; margin-left: auto; }
.opp .h2 { display: flex; align-items: center; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
.opp .h2 .pips { margin-left: auto; gap: 3px; }
.opp .pip { width: 11px; height: 11px; border-width: 2px; }
.opp .lvl { font-size: 8.5px; padding: 1px 5px; }
.opp .handcount { font-size: 11px; }
.opp .handcount .mb { width: 8px; height: 11px; }
.opp .card.sm { --cw: var(--ocw); }
.opp .tabrow { min-height: calc(var(--ocw) * 1.4); margin-top: 4px; }
.opp .tabrow .card { margin-right: calc(var(--ocw) * -.42); }

<script>
/* Something Wild! - rules engine (Spider-Man, Baby Groot and Boba Fett editions).
   Pure logic, no DOM. Works in browsers (global SW) and Node (require). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SW = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const RULES = { HAND: 3, MAX_TABLEAU: 5, WIN: 3 };
  const COLORS = ['red', 'blue', 'green', 'yellow', 'purple'];
  const COLOR_LABEL = { red: 'Red', blue: 'Blue', green: 'Green', yellow: 'Yellow', purple: 'Purple' };

  /* ---- Editions & Power cards ---------------------------------------------
     Every edition (Spider-Man, Baby Groot, Boba Fett...) uses the same 45 character cards;
     only the ten Power cards and the little figure (the "Mover") change.
     Each edition has 10 Powers, 2 per colour. The rulebooks list the 10 effects but the colour of
     each Power card is only visible on the physical cards, so wherever the rulebook doesn't show it
     the colour below is an ASSUMPTION - edit the `color` fields to match your cards.

     Power kinds:
       wild        wild:{by:'color'|'num', value, as:'num'|'color'}  cards in play count as any number / any colour
       score       mode:{type:'color3'|'nums'|'sum'|'colors', ...}    an extra way to score three cards
       guess       guess:'color'|'number'                             guess the top card of the deck, play it if right
       strip       by:'color'|'number'                                flip the top card; everyone else discards a match
       swap                                                           swap one of your cards with a same-colour card
       discardplay cond:{num}|{color}                                 play a card from the discard pile
       extra       cond:{num}                                         draw and play an extra card
       pass        pick:'any'|'high'|'low'                            everyone passes a card to the previous player */
  const P = (id, color, name, kind, extra, text) => Object.assign({ id, color, name, kind, text }, extra);
  const SPIDERMAN_POWERS = [
    P('blue3', 'blue', 'Blue Trio', 'score', { mode: { type: 'color3', color: 'blue' } }, 'With three BLUE cards in play, you may score with them.'),
    P('red3', 'red', 'Red Trio', 'score', { mode: { type: 'color3', color: 'red' } }, 'With three RED cards in play, you may score with them.'),
    P('n268', 'green', '2-6-8', 'score', { mode: { type: 'nums', nums: [2, 6, 8] } }, 'With a 2, a 6 and an 8 in play, you may score with them.'),
    P('redwild', 'red', 'Red Is Wild', 'wild', { wild: { by: 'color', value: 'red', as: 'num' } }, 'Treat RED cards in play as any NUMBER.'),
    P('threewild', 'blue', 'Threes Wild', 'wild', { wild: { by: 'num', value: 3, as: 'num' } }, 'Treat 3s in play as any NUMBER.'),
    P('guesscolor', 'purple', 'Guess a Color', 'guess', { guess: 'color' }, 'Guess a COLOR. Discard the top card of the deck. If it matches, play the card.'),
    P('guessnum', 'purple', 'Guess a Number', 'guess', { guess: 'number' }, 'Guess a NUMBER. Discard the top card of the deck. If it matches, play the card.'),
    P('swap', 'yellow', 'Swap', 'swap', {}, 'Swap a card in play with another player’s card of the same COLOR.'),
    P('seven', 'yellow', 'Lucky Sevens', 'discardplay', { cond: { num: 7 } }, 'If you have any 7s in play, play a card from the discard pile.'),
    P('pass', 'green', 'Pass It On', 'pass', { pick: 'any' }, 'All players pass a card from their hand to the previous player.'),
  ];
  const GROOT_POWERS = [
    P('g_sweepcolor', 'red', 'Color Sweep', 'strip', { by: 'color' }, 'Discard the top card of the deck. All other players discard a card in play that matches that card’s COLOR, if possible.'),
    P('g_sweepnum', 'green', 'Number Sweep', 'strip', { by: 'number' }, 'Discard the top card of the deck. All other players discard a card in play that matches that card’s NUMBER, if possible.'),
    P('g_ninewild', 'yellow', 'Nines Are Wild', 'wild', { wild: { by: 'num', value: 9, as: 'color' } }, 'Treat 9s in play as any COLOR.'),
    P('g_greenwild', 'green', 'Green Is Wild', 'wild', { wild: { by: 'color', value: 'green', as: 'num' } }, 'Treat GREEN cards in play as any NUMBER.'),
    P('g_purple', 'purple', 'Second Chance', 'discardplay', { cond: { color: 'purple' } }, 'If you have any PURPLE cards in play, play a card from the discard pile.'),
    P('g_twos', 'blue', 'Double Time', 'extra', { cond: { num: 2 } }, 'If you have any 2s in play, draw and play an extra card.'),
    P('g_red3', 'red', 'Red Trio', 'score', { mode: { type: 'color3', color: 'red' } }, 'With three RED cards in play, you may score with them.'),
    P('g_358', 'blue', '3-5-8', 'score', { mode: { type: 'nums', nums: [3, 5, 8] } }, 'With a 3, a 5 and an 8 in play, you may score with them.'),
    P('g_sum12', 'yellow', 'Twelve Exactly', 'score', { mode: { type: 'sum', total: 12 } }, 'With three cards in play that total exactly 12, you may score with them.'),
    P('g_pass', 'purple', 'Pass It On', 'pass', { pick: 'any' }, 'All players pass a card from their hand to the previous player.'),
  ];
  const BOBA_POWERS = [
    P('b_bluewild', 'blue', 'Blue Is Wild', 'wild', { wild: { by: 'color', value: 'blue', as: 'num' } }, 'Treat BLUE cards in play as any NUMBER.'),
    P('b_greenwild', 'green', 'Green Chameleon', 'wild', { wild: { by: 'color', value: 'green', as: 'color' } }, 'Treat GREEN cards in play as any COLOR.'),
    P('b_oneswild', 'yellow', 'Ones Are Wild', 'wild', { wild: { by: 'num', value: 1, as: 'num' } }, 'Treat 1s in play as any NUMBER.'),
    P('b_swap', 'purple', 'Swap', 'swap', {}, 'Swap one of your cards in play with another player’s card of the same COLOR.'),
    P('b_sixes', 'blue', 'Sixes Bonus', 'extra', { cond: { num: 6 } }, 'If you have any 6s in play, draw and play an extra card.'),
    P('b_sum16', 'green', 'Sweet Sixteen', 'score', { mode: { type: 'sum', total: 16 } }, 'With three cards in play that total exactly 16, you may score with them.'),
    P('b_yellow3', 'yellow', 'Yellow Trio', 'score', { mode: { type: 'color3', color: 'yellow' } }, 'With three YELLOW cards in play, you may score with them.'),
    P('b_bgr', 'red', 'Tri-Color', 'score', { mode: { type: 'colors', colors: ['blue', 'green', 'red'] } }, 'With a BLUE, a GREEN and a RED card in play, you may score with them.'),
    P('b_passhigh', 'red', 'Pass the High', 'pass', { pick: 'high' }, 'All players pass the highest-numbered card from their hand to the previous player.'),
    P('b_passlow', 'purple', 'Pass the Low', 'pass', { pick: 'low' }, 'All players pass the lowest-numbered card from their hand to the previous player.'),
  ];
  const EDITIONS = {
    spiderman: { id: 'spiderman', name: 'Spider-Man', blurb: 'Swing for sets and runs. Guess, swap and pass.', moverWord: 'Mover', powers: SPIDERMAN_POWERS },
    groot: { id: 'groot', name: 'Baby Groot', blurb: 'Sweep rivals’ cards and bend colors.', moverWord: 'Mover', powers: GROOT_POWERS },
    boba: { id: 'boba', name: 'Boba Fett', blurb: 'Wild colors, swaps and sneaky passes.', moverWord: 'Figure', powers: BOBA_POWERS },
  };
  const EDITION_LIST = ['spiderman', 'groot', 'boba'].map(k => EDITIONS[k]);
  const POWERS = SPIDERMAN_POWERS; // default edition (kept for older callers)
  const ALL_POWERS = EDITION_LIST.reduce((a, e) => a.concat(e.powers), []);
  const POWER_BY_ID = {};
  ALL_POWERS.forEach(p => (POWER_BY_ID[p.id] = p));
  const editionOf = state => EDITIONS[(state && state.edition) || 'spiderman'];

  /* ---- Cards ------------------------------------------------------------ */
  const ALL_CARDS = [];
  COLORS.forEach(color => { for (let n = 1; n <= 9; n++) ALL_CARDS.push({ id: color + n, color, num: n }); });
  const CARD_BY_ID = {};
  ALL_CARDS.forEach(c => (CARD_BY_ID[c.id] = c));
  const cardName = c => COLOR_LABEL[c.color] + ' ' + c.num;
  const hasMoverSymbol = c => c.num === 1; // the five 1s carry the "take a mover" symbol

  /* ---- Utilities -------------------------------------------------------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function combos3(arr) {
    const out = [];
    for (let i = 0; i < arr.length; i++)
      for (let j = i + 1; j < arr.length; j++)
        for (let k = j + 1; k < arr.length; k++) out.push([arr[i], arr[j], arr[k]]);
    return out;
  }
  function removeById(arr, id) {
    const i = arr.findIndex(c => c.id === id);
    if (i < 0) throw new Error('card not found: ' + id);
    return arr.splice(i, 1)[0];
  }

  /* ---- Scoring logic ----------------------------------------------------- */
  const NEVER = () => false;
  /** Which cards in play does this Power make wild? { num: fn, col: fn } */
  function wildFns(power) {
    const out = { num: NEVER, col: NEVER };
    if (power && power.kind === 'wild') {
      const w = power.wild;
      const f = w.by === 'color' ? c => c.color === w.value : c => c.num === w.value;
      out[w.as === 'color' ? 'col' : 'num'] = f;
    }
    return out;
  }
  function isSet(cards, wn) {
    wn = wn || NEVER;
    const nums = new Set();
    for (const c of cards) if (!wn(c)) nums.add(c.num);
    return nums.size <= 1;
  }
  function isRun(cards, wn, wc) {
    wn = wn || NEVER; wc = wc || NEVER;
    const cols = new Set(cards.filter(c => !wc(c)).map(c => c.color));
    if (cols.size > 1) return false;
    const fixed = cards.filter(c => !wn(c)).map(c => c.num);
    if (new Set(fixed).size !== fixed.length) return false;
    if (fixed.length === 0) return true;
    const mn = Math.min(...fixed), mx = Math.max(...fixed);
    if (mx - mn > 2) return false;
    return Math.max(1, mx - 2) <= Math.min(7, mn);
  }
  function powerModeMatch(cards, power) {
    if (!power || power.kind !== 'score') return false;
    const m = power.mode;
    switch (m.type) {
      case 'color3': return cards.every(c => c.color === m.color);
      case 'nums': {
        const a = cards.map(c => c.num).sort((x, y) => x - y), b = m.nums.slice().sort((x, y) => x - y);
        return a.length === b.length && a.every((v, i) => v === b[i]);
      }
      case 'sum': return cards.reduce((t, c) => t + c.num, 0) === m.total;
      case 'colors': {
        const a = cards.map(c => c.color).sort(), b = m.colors.slice().sort();
        return a.length === b.length && a.every((v, i) => v === b[i]);
      }
      default: return false;
    }
  }
  /** What kind of score is this triple? returns 'set' | 'run' | 'power' | null */
  function tripleKind(cards, power) {
    const w = wildFns(power);
    if (isSet(cards, w.num)) return 'set';
    if (isRun(cards, w.num, w.col)) return 'run';
    if (powerModeMatch(cards, power)) return 'power';
    return null;
  }
  const isScoringTriple = (cards, power) => tripleKind(cards, power) !== null;
  /** All scoring triples in a tableau given the Power used this turn (or null). */
  function findTriples(tableau, power) {
    return combos3(tableau).filter(t => isScoringTriple(t, power));
  }
  /** Does the condition {num} / {color} hold for any card in play? */
  const condMet = (cond, tab) => tab.some(c => (cond.num != null ? c.num === cond.num : c.color === cond.color));
  const condText = cond => (cond.num != null ? `a ${cond.num}` : `a ${COLOR_LABEL[cond.color].toLowerCase()} card`);

  /* ---- Power feasibility ------------------------------------------------- */
  function swapPairs(state, pi) {
    const me = state.players[pi];
    const pairs = [];
    me.tableau.forEach(mine => {
      state.players.forEach((o, oi) => {
        if (oi === pi) return;
        o.tableau.forEach(theirs => {
          if (theirs.color === mine.color) pairs.push({ mine: mine.id, theirs: theirs.id, other: oi });
        });
      });
    });
    return pairs;
  }
  function powerFeasibility(state, pi, power) {
    const me = state.players[pi];
    switch (power.kind) {
      case 'guess':
      case 'strip':
        return state.deck.length + state.discard.length > 0 ? { ok: true } : { ok: false, reason: 'No cards left to reveal' };
      case 'swap':
        return swapPairs(state, pi).length ? { ok: true } : { ok: false, reason: 'No matching colors to swap' };
      case 'discardplay':
        if (!condMet(power.cond, me.tableau)) return { ok: false, reason: `You have no ${condText(power.cond).replace(/^a /, '')} in play` };
        if (!state.discard.length) return { ok: false, reason: 'Discard pile is empty' };
        return { ok: true };
      case 'extra':
        if (!condMet(power.cond, me.tableau)) return { ok: false, reason: `You have no ${condText(power.cond).replace(/^a /, '')} in play` };
        return state.deck.length + state.discard.length > 0 ? { ok: true } : { ok: false, reason: 'No cards left to draw' };
      case 'pass':
        return state.players.every(p => p.hand.length > 0) ? { ok: true } : { ok: false, reason: 'Nobody has cards to pass' };
      default:
        return { ok: true };
    }
  }
  /** Powers the player may use right now (needs the mover). */
  function usablePowers(state, pi) {
    if (state.mover !== pi) return [];
    const me = state.players[pi];
    const list = [];
    me.powers.forEach(p => list.push({ power: p, source: 'own' }));
    if (state.center) list.push({ power: state.center, source: 'center' });
    return list.map(o => {
      const f = powerFeasibility(state, pi, o.power);
      let scores = false;
      if (o.power.kind === 'wild' || o.power.kind === 'score')
        scores = findTriples(me.tableau, o.power).length > 0;
      return { power: o.power, source: o.source, feasible: f.ok, reason: f.reason, scores };
    });
  }

  /* ---- Game setup --------------------------------------------------------- */
  function newGame(opts) {
    const seed = opts.seed != null ? opts.seed : (Math.random() * 4294967296) >>> 0;
    const rng = mulberry32(seed);
    const players = opts.players.map((p, i) => ({
      id: i, name: p.name, human: !!p.human, level: p.level || null,
      hand: [], tableau: [], powers: [],
    }));
    const deck = shuffle(ALL_CARDS.slice(), rng);
    for (let r = 0; r < RULES.HAND; r++) players.forEach(p => p.hand.push(deck.pop()));
    const edition = EDITIONS[opts.edition || 'spiderman'];
    if (!edition) throw new Error('unknown edition ' + opts.edition);
    const powerPile = shuffle(edition.powers.slice(), rng);
    const center = powerPile.pop();
    const first = opts.first == null || opts.first === 'random' ? Math.floor(rng() * players.length) : opts.first;
    return { players, deck, discard: [], powerPile, center, mover: null, current: first,
      turnNo: 0, winner: null, rng, turn: null, seed, edition: edition.id };
  }

  async function emit(hooks, type, data) {
    if (hooks && hooks.event) await hooks.event(type, data || {});
  }
  async function drawCard(state, hooks) {
    if (state.deck.length === 0 && state.discard.length > 0) {
      state.deck = shuffle(state.discard.splice(0), state.rng);
      await emit(hooks, 'reshuffle', {});
    }
    return state.deck.pop() || null;
  }

  /* ---- Power effects -------------------------------------------------------- */
  async function applyPower(state, pi, power, agents, hooks) {
    const p = state.players[pi];
    const ag = agents[pi];
    state.turn.power = power;

    await emit(hooks, 'draw', { player: pi, card: drawn });

      const kind = tripleKind(triple, state.turn.power);

      p.powers.push(gained);

      await emit(hooks, 'score', { player: pi, cards: triple, kind, power: gained, next: state.center });

        ids.push(extra.id);
      }

      gone.forEach(c => state.discard.push(c));
      await emit(hooks, 'discard', { player: pi, cards: gone });
    }

    state.turn = null;
    state.current = (state.current + 1) % state.players.length;
    state.turnNo++;
  }

    const cap = maxTurns || 600;
    while (state.winner == null && state.turnNo < cap) await runTurn(state, agents, hooks);

  }

    const a = baseAgent(rng);

    let plan_ = null;
    a.choosePlay = (s, i) => {
      const hand = s.players[i].hand;
      plan_ = { use: rng() < pp };
      return pick(hand, rng).id;
    };
    a.choosePower = (s, i, opts) => {
      if (!plan_ || !plan_.use) return null;
      const f = opts.filter(o => o.feasible);
      return f.length ? { id: pick(f, rng).power.id } : null;
    };
    a.chooseColor = () => pick(COLORS, rng);
    a.chooseNumber = () => 1 + Math.floor(rng() * 9);
    a.chooseSwap = (s, i, pairs) => pick(pairs, rng);
    a.chooseDiscardPick = (s, i, pile) => pick(pile, rng).id;
    return a;
  }

  function thinkingAgent(skill, rng) {
    const a = baseAgent(rng);
    let cur = null;
    const ctxFor = (s, i) => makeCtx(s, i, skill);
    a.choosePlay = (s, i) => { cur = plan(s, i, skill, rng); return cur.cardId; };
    a.choosePower = (s, i, opts) => {
      if (!cur || cur.option.kind === 'none') return null;
      const o = opts.find(x => x.power.id === cur.option.id && x.feasible);
      return o ? { id: o.power.id } : null;
    };
    a.chooseColor = () => (cur && cur.option.color) || pick(COLORS, rng);
    a.chooseNumber = () => (cur && cur.option.number) || 1 + Math.floor(rng() * 9);
    a.chooseSwap = (s, i, pairs) => {
      if (cur && cur.option.pair) {
        const m = pairs.find(p => p.mine === cur.option.pair.mine && p.theirs === cur.option.pair.theirs);
        if (m) return m;
      }
      return pairs[0];
    };
    a.chooseDiscardPick = (s, i, pile) => {
      if (cur && cur.option.pick && pile.some(c => c.id === cur.option.pick)) return cur.option.pick;
      // fall back: best by evaluation
      const p = s.players[i], ctx = ctxFor(s, i);
      let best = null;
      for (const d of pile) {
        const v = valueOutcome(s, i, p.tableau.concat([d]), p.hand, null, true, ctx);
        if (!best || v > best.v) best = { v, id: d.id };
      }
      return best.id;
    };
    a.choosePassCard = (s, i, allowed) => {
      // give away the card that hurts least to lose
      const p = s.players[i], ctx = ctxFor(s, i);
      let best = null;
      for (const c of (allowed || p.hand)) {
        const v = evalTab(s, i, p.tableau, p.hand.filter(x => x !== c), ctx, s.mover === i);
        if (!best || v > best.v) best = { v, id: c.id };
      }
      return best.id;
    };
    a.chooseStrip = (s, i, ids) => {
      // lose the card that matters least
      const p = s.players[i], ctx = ctxFor(s, i);
      let best = null;
      for (const id of ids) {
        const v = evalTab(s, i, p.tableau.filter(c => c.id !== id), p.hand, ctx, s.mover === i);
        if (!best || v > best.v) best = { v, id };
      }
      return best.id;
    };
    a.chooseExtraPlay = (s, i) => {
      const p = s.players[i], ctx = ctxFor(s, i);
      let best = null;
      for (const c of p.hand) {
        const v = valueOutcome(s, i, p.tableau.concat([c]), p.hand.filter(x => x !== c), null, true, ctx);
        if (!best || v > best.v) best = { v, id: c.id };
      }
      return best.id;
    };
    a.chooseTriple = (s, i, triples) => {
      const p = s.players[i], ctx = ctxFor(s, i);
      let best = null;
      triples.forEach((tr, idx) => {
        const ids = new Set(tr.map(c => c.id));
        const v = evalTab(s, i, p.tableau.filter(c => !ids.has(c.id)), p.hand, ctx, s.mover === i);
        if (!best || v > best.v) best = { v, idx };
      });
      return best.idx;
    };
    a.chooseDiscards = (s, i, n) => {
      const p = s.players[i], ctx = ctxFor(s, i);
      const idxs = p.tableau.map((_, k) => k);
      const subsets = n === 1 ? idxs.map(k => [k]) : n === 2 ? combos2(idxs) : [idxs.slice(0, n)];
      let best = null;
      for (const sub of subsets) {
        const kept = p.tableau.filter((_, k) => !sub.includes(k));
        const v = potential(kept, p.hand, withHeld(ctx, s.mover === i));
        if (!best || v > best.v) best = { v, sub };
      }
      return best.sub.map(k => p.tableau[k].id);
    };
    return a;
  }

  const SKILLS = {
    medium: { useHand: false, counting: false, risky: false, disrupt: false, noise: 6 },
    hard:   { useHand: true,  counting: true,  risky: true,  disrupt: true,  noise: 1 },
  };

  function unpredictableAgent(rng) {
    const styles = {
      hard: thinkingAgent(SKILLS.hard, rng),
      medium: thinkingAgent(SKILLS.medium, rng),
      chaos: easyAgent(rng, 0.9),
      lucky: easyAgent(rng, 0.5),
    };
    const weights = [['hard', 34], ['medium', 26], ['chaos', 22], ['lucky', 18]];
    let mood = 'medium';
    const roll = () => {
      let r = rng() * 100;
      for (const [k, w] of weights) { if ((r -= w) < 0) return k; }
      return 'medium';
    };
    const a = {};
    a.choosePlay = (s, i) => { mood = roll(); return styles[mood].choosePlay(s, i); };
    ['choosePower', 'chooseColor', 'chooseNumber', 'chooseSwap', 'chooseDiscardPick',
     'choosePassCard', 'chooseTriple', 'chooseDiscards', 'chooseStrip', 'chooseExtraPlay'].forEach(m => {
      a[m] = (...args) => styles[mood][m](...args);
    });
    a.mood = () => mood;
    return a;
  }

  /* Easy: mostly random, but now and then spots a sensible play (so a kid can lose to it, occasionally). */
  function easyMixAgent(rng, smartProb) {
    const rand = easyAgent(rng, 0.3);
    const smart = thinkingAgent(SKILLS.medium, rng);
    let cur = rand;
    const a = {};
    a.choosePlay = (s, i) => { cur = rng() < smartProb ? smart : rand; return cur.choosePlay(s, i); };
    ['choosePower', 'chooseColor', 'chooseNumber', 'chooseSwap', 'chooseDiscardPick',
     'choosePassCard', 'chooseTriple', 'chooseDiscards', 'chooseStrip', 'chooseExtraPlay'].forEach(m => {
      a[m] = (...args) => cur[m](...args);
    });
    return a;
  }

  function createAgent(level, rng) {
    rng = rng || Math.random;
    if (level === 'easy') return easyMixAgent(rng, 0.4);
    if (level === 'medium') return thinkingAgent(SKILLS.medium, rng);
    if (level === 'hard') return thinkingAgent(SKILLS.hard, rng);
    if (level === 'unpredictable') return unpredictableAgent(rng);
    throw new Error('unknown level ' + level);
  }

  /* A suggestion for the human player's hint button (uses the Hard brain, no randomness). */
  function suggest(state, me) {
    const best = plan(state, me, { ...SKILLS.hard, noise: 0 }, () => 0.5);
    if (!best) return null;
    const o = best.option;
    let why = 'builds toward a set or run';
    if (o.kind === 'power') why = 'sets up a score with a Power';
    else if (o.kind !== 'none') why = 'sets up a good Power play';
    return { cardId: best.cardId, why, option: o };
  }

  return { LEVELS, createAgent, suggest, _thinkingAgent: thinkingAgent, _SKILLS: SKILLS };
});
